<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دعوت به جشن آغاز سال تحصیلی</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff8e8,#eaf7ff);font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#24364b}
.wrap{text-align:center;width:min(92vw,520px);padding:25px}
.hint{font-size:15px;color:#667085;margin-bottom:22px;animation:pulse 1.8s infinite}
.envelope{position:relative;width:min(86vw,380px);height:245px;margin:auto;cursor:pointer;perspective:1000px;filter:drop-shadow(0 18px 20px rgba(35,55,75,.18))}
.back{position:absolute;inset:0;background:#f4c76b;border-radius:12px;overflow:hidden}
.paper{position:absolute;left:8%;width:84%;height:88%;top:7%;background:#fffdf8;border-radius:8px;padding:25px 18px;box-shadow:0 5px 18px rgba(0,0,0,.12);transform:translateY(30px);transition:1s;z-index:2}
.paper h1{font-size:23px;margin:4px 0 18px;color:#bc6b17}
.paper .line{font-size:17px;line-height:2.05}.place{font-weight:bold;color:#456b8b;margin-top:10px}
.flap{position:absolute;z-index:4;top:0;left:0;width:0;height:0;border-left:190px solid transparent;border-right:190px solid transparent;border-top:125px solid #eab85b;transform-origin:top center;transition:1s;filter:drop-shadow(0 2px 1px rgba(0,0,0,.08))}
.left,.right{position:absolute;bottom:0;width:0;height:0;z-index:3}
.left{left:0;border-top:125px solid transparent;border-bottom:0;border-left:190px solid #f8d784}
.right{right:0;border-top:125px solid transparent;border-right:190px solid #f8d784}
.front{position:absolute;bottom:0;left:0;right:0;height:125px;background:#f3c96e;z-index:3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:0 0 12px 12px}
.seal{position:absolute;z-index:5;left:50%;top:53%;transform:translate(-50%,-50%);width:55px;height:55px;border-radius:50%;background:#c9574b;color:white;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:.7s}
.open .flap{transform:rotateX(180deg);z-index:1}.open .paper{transform:translateY(-82px);z-index:6}.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.message{margin-top:115px;opacity:0;transform:translateY(15px);transition:1s .5s}.open + .message{opacity:1;transform:none}
.message h2{font-size:25px;margin:0 0 8px;color:#315f7d}.message p{margin:7px 0;line-height:1.8}
button{margin-top:15px;border:0;background:#315f7d;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;cursor:pointer}
@keyframes pulse{50%{opacity:.55}}
@media(max-width:420px){.envelope{height:220px}.flap{border-left-width:43vw;border-right-width:43vw;border-top-width:112px}.left{border-left-width:43vw;border-top-width:112px}.right{border-right-width:43vw;border-top-width:112px}.paper h1{font-size:20px}.paper .line{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hint">برای باز کردن دعوت‌نامه روی پاکت بزنید 💌</div>
<div class="envelope" id="env" onclick="openLetter()">
  <div class="back"></div>
  <div class="paper">
    <h1>دعوت به جشن آغاز سال تحصیلی</h1>
    <div class="line">روز یکشنبه ۲۹ شهریور ماه</div>
    <div class="line">از ساعت <b>۹ صبح</b></div>
    <div class="line place">📍 سینما شاهین طلایی شاهین‌شهر</div>
  </div>
  <div class="flap"></div><div class="left"></div><div class="right"></div><div class="front"></div>
  <div class="seal">🎓</div>
</div>
<div class="message">
  <h2>منتظر حضور گرمتان هستیم 🌷</h2>
  <p>آغاز سال تحصیلی جدید را در کنار هم جشن می‌گیریم.</p>
  <button onclick="location.reload()">بستن دعوت‌نامه</button>
</div>
</div>
<script>
function openLetter(){document.getElementById('env').classList.add('open')}
</script>
</body>
</html>
